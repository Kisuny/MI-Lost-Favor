name: Build modpack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Modpack version (leave empty to use the one from pakku.json)
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build client and server packs
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION_ARGS=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_ARGS=(--version "${GITHUB_REF_NAME#v}")
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION_ARGS=(--version "$INPUT_VERSION")
          fi
          python3 scripts/build/build.py "${VERSION_ARGS[@]}"

      - name: Read modpack version
        id: version
        run: echo "version=$(jq -r .version src/pakku.json)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../dist
          OUT=../dist/changes.md
          MODS="$RUNNER_TEMP/mods.md"
          # only release tags like v1.2.3, junk tags (v.0.5.1, v0.5.0-test) are ignored
          TAGS=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PREV=$(printf '%s\n%s\n' "$TAGS" "$GITHUB_REF_NAME" | sed '/^$/d' | sort -Vu | grep -B1 -x "$GITHUB_REF_NAME" | head -n 1)
            [[ "$PREV" == "$GITHUB_REF_NAME" ]] && PREV=""
          else
            PREV=$(echo "$TAGS" | tail -n 1)
          fi
          : > "$OUT"
          if [[ -n "$PREV" ]]; then
            echo "Comparing with ${PREV}"
            if git show "${PREV}:src/pakku-lock.json" > old-lock.json 2>/dev/null; then
              java -jar ../pakku.jar diff -v --markdown "$MODS" old-lock.json pakku-lock.json || true
            fi
            rm -f old-lock.json
            CURRENT=$([[ "${GITHUB_REF_TYPE}" == "tag" ]] && echo "$GITHUB_REF_NAME" || echo "$GITHUB_SHA")
            COMMITS=$(git log --no-merges --reverse --format='- %s (%h)' "${PREV}..HEAD")
            # drop pakku's own "## Projects" header, wrap file names of updated mods in backticks
            MODS_BODY=""
            if [[ -s "$MODS" ]]; then
              MODS_BODY=$(sed -E -e '/^## Projects$/{N;d}' -e 's/^- (.*[^ ]) +-> +(.+)$/- `\1` -> `\2`/' "$MODS")
            fi
            {
              echo "## Changes"
              echo
              if [[ -n "$COMMITS" ]]; then echo "$COMMITS"; else echo "No commits."; fi
              echo
              echo "## Mods"
              echo
              if [[ -n "${MODS_BODY//[[:space:]]/}" ]]; then echo "$MODS_BODY"; else echo "No mod changes."; fi
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${CURRENT}"
            } > "$OUT"
          else
            echo "No previous release to compare with." > "$OUT"
          fi
          cat "$OUT"
        working-directory: src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MI-Lost-Favor-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          files: dist/*.zip
          body_path: dist/changes.md
