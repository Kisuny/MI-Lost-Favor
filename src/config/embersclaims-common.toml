[homes]
	#Parties can set a home with /party sethome and return with /party home
	enabled = true
	#Seconds between /party home uses per player
	# Default: 60
	# Range: 0 ~ 86400
	cooldown_seconds = 60
	#The home must stay inside one of the party's claims
	require_claim = true
	#Allow /party home from another dimension
	cross_dimension = true

[costs]
	#Price of each claimed chunk: empty for free, money:<amount> (Ember's Questing money), item:<id>:<count> or item:#<tag>:<count>
	claim = ""
	#Price of force loading a chunk, same format as claim
	forceload = ""
	#Claims each party gets before the claim price applies
	# Default: 0
	# Range: 0 ~ 100000
	free_claims = 0
	#Share of the price paid back when a paid chunk is unclaimed or stops force loading
	# Default: 100
	# Range: 0 ~ 100
	refund_percent = 100
	#Players in creative mode claim for free
	creative_free = true
	#How the claim price rises with each paid claim a party owns: NONE, LINEAR (adds growth_percent of the base each claim) or EXPONENTIAL (multiplies by 1 + growth_percent each claim)
	#Allowed Values: NONE, LINEAR, EXPONENTIAL
	growth = "NONE"
	#Percent the claim price rises per claim under growth
	# Default: 0.0
	# Range: 0.0 ~ 10000.0
	growth_percent = 0.0
	#Currency for selling chunks with /claims sell: money:1 or item:<id> or item:#<tag>. Empty turns chunk sales off
	market = ""
	#Percent of every chunk sale or lease that goes to nobody, rounded up
	# Default: 0
	# Range: 0 ~ 100
	market_tax = 0
	#Price of one extra claim slot bought with /party buyslot: money:<amount>, item:<id>:<count> or item:#<tag>:<count>. Empty turns buying off
	claim_slot = ""
	#Most extra claim slots one party can buy
	# Default: 32
	# Range: 0 ~ 100000
	max_bought_slots = 32
	#Officers can auction chunks with /claims auction. Needs a market currency
	auctions = false
	#Longest auction in hours
	# Default: 168
	# Range: 1 ~ 8760
	auction_max_hours = 168
	#Percent a bid must beat the current bid by, at least 1
	# Default: 5
	# Range: 0 ~ 1000
	auction_step_percent = 5
	#A bid this many minutes before the end moves the end to this many minutes after the bid. 0 turns it off
	# Default: 5
	# Range: 0 ~ 1440
	auction_extend_minutes = 5
	#Officers can sell access passes to a profile's chunks with /party pass sell. Needs a market currency
	passes = false
	#Longest pass in hours
	# Default: 720
	# Range: 1 ~ 87600
	pass_max_hours = 720

[pricing]
	#Price multipliers per dimension as id=multiplier, used for claim prices and upkeep
	dimensions = []
	#Price multipliers per biome as id=multiplier or #tag=multiplier. The first matching entry wins
	biomes = []
	#Price multipliers for chunks touching a structure, as id=multiplier or #tag=multiplier. The highest matching structure wins
	structures = []

[upkeep]
	#Parties pay rent for their claims from a party balance filled with /party upkeep deposit
	enabled = false
	#Rent per chunk per period, and the currency of the balance: money:<amount> or item:<id>:<count> or item:#<tag>:<count>
	cost = ""
	#Real minutes between rent payments
	# Default: 1440
	# Range: 1 ~ 525600
	interval_minutes = 1440
	#Oldest chunks of each party that pay no rent
	# Default: 0
	# Range: 0 ~ 100000
	free_chunks = 0
	#How rent per chunk rises with the number of chunks: NONE, LINEAR or EXPONENTIAL
	#Allowed Values: NONE, LINEAR, EXPONENTIAL
	growth = "NONE"
	#Percent rent per chunk rises per chunk under growth
	# Default: 0.0
	# Range: 0.0 ~ 10000.0
	growth_percent = 0.0
	#Rent multiplier for force loaded chunks
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	forceload_multiplier = 2.0
	#Unpaid periods in a row before the penalty starts
	# Default: 3
	# Range: 0 ~ 1000
	grace_periods = 3
	#Penalty after the grace periods: RELEASE newest claims, or UNPROTECT every claim of the party until the debt is paid
	#Allowed Values: RELEASE, UNPROTECT
	unpaid = "RELEASE"
	#Newest chunks released each unpaid period with RELEASE, 0 releases all of them at once
	# Default: 0
	# Range: 0 ~ 100000
	release_chunks = 0
	#Parties in debt cannot claim new chunks
	block_claims = true
	#Force loaded chunks stop loading while the party is in debt
	stop_forceloads = true
	#Players without a party also pay rent for their own claims
	charge_personal = true
	#When the balance cannot cover rent, take the rest from online members: OFF, OWNER only, or MEMBERS (owner first, then officers, then members)
	#Allowed Values: OFF, OWNER, MEMBERS
	auto_pay = "OFF"

[questing]
	#Ember's Questing stage bonuses as stage:claims:forceloads, counted for every member holding the stage
	stage_bonuses = []
