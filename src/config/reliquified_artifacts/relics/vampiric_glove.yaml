                    # Type of mathematical operation used to calculate the stat's value based on the ability level.
                    scalingModel: relics:multiplicative_base
                    # Value the stat reaches when both the stat quality and ability level are at their maximum.
                    targetValue: 3.00105
levelingData:
    # Amount of experience required to level up to relic level 1
    initialCost: 250.0
    # Increment in experience required for each subsequent level of the relic
    step: 250.0
lootData:
    # List of conditions for obtaining the relic. Supports both direct ID specification and regular expressions.
    entries:
    -   biomes:
        - '[\w]+:.*(swamp|marsh|bog|fen|wetland|quagmire|morass|slough|bayou|mud)[\w_\/]*'
        dimensions:
        - .*
        tables:
        - '[\w]+:chests\/[\w_\/]*[\w]+[\w_\/]*'
        weight: 300
